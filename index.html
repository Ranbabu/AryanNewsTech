<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI News Studio Pro</title>
<script src="https://js.puter.com/v2/"></script>
<style>
    :root { --bg-color:#121212; --card-bg:#1e1e1e; --text-main:#ffffff; --accent:#00d26a; --border:#333333; --danger:#ff4444; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color:var(--bg-color); color:var(--text-main); margin:0; padding:15px; }
    h2 { font-size:1.3rem; margin-bottom:10px; text-align:center; color:var(--accent); }
    
    .puter-bar { display:flex; justify-content:space-between; align-items:center; background:#252525; padding:8px 12px; border-radius:8px; margin-bottom:12px; font-size:0.85rem; border:1px solid var(--border); }
    .puter-btn { width:auto; padding:6px 12px; font-size:0.8rem; background:#444; color:#fff; border-radius:5px; margin:0; }
    
    .card { background-color:var(--card-bg); padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid var(--border); }
    label { font-size:0.9rem; margin-bottom:5px; display:block; color:#aaa; font-weight:600; }
    input, select, textarea { width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid var(--border); background-color:var(--bg-color); color:var(--text-main); font-size:1rem; box-sizing:border-box; }
    textarea { resize:vertical; min-height:120px; }
    button { width:100%; padding:14px; background-color:var(--accent); color:#000; border:none; border-radius:8px; font-size:1rem; font-weight:bold; cursor:pointer; transition:0.2s; }
    button:active { opacity:0.7; }
    button:disabled { background-color:#555; color:#888; cursor:not-allowed; }
    .btn-group { display:flex; gap:10px; margin-top:5px; }
    .btn-secondary { background-color:#444; color:#fff; }
    .btn-copy { background-color:#007bff; color:#fff; }
    .tabs { display:flex; gap:8px; margin-bottom:15px; }
    .tab-btn { background-color:var(--card-bg); color:var(--text-main); border:1px solid var(--border); flex:1; font-size:0.9rem; padding:12px 4px; }
    .tab-btn.active { background-color:var(--accent); color:#000; border-color:var(--accent); }
    .hidden { display:none !important; }
    
    .spin-row { display:flex; align-items:center; justify-content:center; gap:10px; margin:12px 0; }
    .spinner { width:24px; height:24px; border:3px solid #333; border-top-color:var(--accent); border-radius:50%; animation:spin 0.9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #statusText { color:#aaa; font-size:0.85rem; }
    #timerText { color:var(--accent); font-weight:bold; font-size:0.95rem; }
    
    #thumbImg { width:100%; border-radius:8px; border:1px solid var(--border); margin-bottom:10px; display:block; aspect-ratio:16/9; object-fit:cover; }
    .notice { background:#2a1810; border-left:4px solid #ff9800; padding:10px; font-size:0.8rem; color:#ffcc80; margin-bottom:15px; border-radius:4px; line-height:1.4; }
</style>
</head>
<body>

<h2>AI News Studio Pro</h2>

<!-- Puter Account Status Bar -->
<div class="puter-bar">
    <span id="userStatus">👤 Puter: Checking...</span>
    <div>
        <button class="puter-btn" onclick="loginPuter()">Login</button>
        <button class="puter-btn" onclick="switchPuterAccount()" style="background:#d9534f;">नया अकाउंट</button>
    </div>
</div>

<div class="tabs">
    <button class="tab-btn active" id="tab-thumb" onclick="switchTab('thumb')">🎨 Thumbnail (ChatGPT)</button>
    <button class="tab-btn" id="tab-script" onclick="switchTab('script')">📝 Script</button>
</div>

<!-- ========== MODULE: THUMBNAIL (CHATGPT STYLE) ========== -->
<div id="thumb-module" class="card">
    <label>🎨 AI Engine चुनें</label>
    <select id="engineSelect">
        <option value="dall-e-3" selected>🌟 ChatGPT DALL-E 3 (16:9 YouTube News + Perfect Hindi)</option>
        <option value="cf-flux">☁️ Cloudflare Workers AI (Backup - बिना लॉगिन)</option>
    </select>

    <div class="notice">
        💡 <b>ChatGPT जैसी हिंदी और कोलाज के लिए:</b> ऊपर DALL-E 3 ही चुनें। यह सीधे <b>16:9 YouTube साइज़</b> में जनरेट करेगा। अगर "Low Balance" कहे, तो ऊपर लाल बटन <b>'नया अकाउंट'</b> दबाकर नए जीमेल से लॉगिन कर लें।
    </div>

    <label>Prompt Paste Box</label>
    <textarea id="promptBox" style="min-height:160px;" placeholder="यहाँ पूरा प्रॉम्प्ट पेस्ट करें..."></textarea>

    <button id="thumbBtn" onclick="generateThumbnail()">🎨 Generate 16:9 News Thumbnail</button>

    <div id="genStatus" class="spin-row hidden">
        <div class="spinner"></div>
        <span id="statusText">ChatGPT इंजन से थंबनेल बन रहा है...</span>
        <span id="timerText">⏱️ 00:00</span>
    </div>

    <div id="thumbResult" class="hidden" style="margin-top:15px;">
        <img id="thumbImg" alt="Generated YouTube Thumbnail">
        <div class="btn-group">
            <button class="btn-copy" onclick="downloadThumbnail()">⬇️ HD Thumbnail डाउनलोड करें (16:9)</button>
        </div>
    </div>
</div>

<!-- ========== MODULE: SCRIPT ========== -->
<div id="script-module" class="card hidden">
    <label>AI Model</label>
    <select id="modelSelect">
        <option value="google/gemini-2.5-flash:free" selected>Gemini 2.5 Flash (Free)</option>
        <option value="qwen/qwen-2.5-72b-instruct:free">Qwen 72B (Hindi News Anchor)</option>
    </select>

    <label>Topic / News Content</label>
    <textarea id="promptInput" placeholder="टॉपिक लिखें...">नमस्कार! आर्यन न्यूज़ टेक पर आज की बड़ी खबरें। साफ़ हिंदी पैराग्राफ में बिना बुलेट पॉइंट के लिखें।</textarea>

    <button id="generateBtn" onclick="generateScript()">Generate Script</button>
    <div id="scriptLoader" style="display:none; text-align:center; color:var(--accent); margin:10px 0;">Generating script...</div>

    <label style="margin-top:15px;">Output Script</label>
    <textarea id="scriptOutput" style="min-height:180px;"></textarea>

    <button class="btn-copy" onclick="copyScript()">📋 Copy Script</button>
</div>

<script>
const WORKER_URL = "https://aryannewstech.babu902654.workers.dev";
let currentImageUrl = null;
let timerInterval = null, startTime = 0;

/* ================= PUTER AUTH & STATUS ================= */
async function checkPuterStatus() {
    const statusEl = document.getElementById('userStatus');
    if (!window.puter) {
        statusEl.textContent = "⚠️ Puter.js Load नहीं हुआ";
        return;
    }
    if (puter.auth.isSignedIn()) {
        try {
            const user = await puter.auth.getUser();
            statusEl.innerHTML = `🟢 <b>${user.username || 'User'}</b> (Logged In)`;
        } catch(e) {
            statusEl.textContent = "🟢 Logged In";
        }
    } else {
        statusEl.innerHTML = `🔴 <b>Guest</b> (लॉगिन ज़रूरी)`;
    }
}
window.addEventListener('load', checkPuterStatus);

async function loginPuter() {
    await puter.auth.signIn();
    checkPuterStatus();
}

async function switchPuterAccount() {
    if (confirm("क्या आप नए अकाउंट से लॉगिन करके फ़्री कोटा रिसेट करना चाहते हैं?")) {
        try { puter.auth.signOut(); } catch(e){}
        await puter.auth.signIn();
        checkPuterStatus();
    }
}

/* ================= TAB SWITCH ================= */
function switchTab(tab) {
    ['script','thumb'].forEach(t => {
        document.getElementById(t + '-module').classList.add('hidden');
        document.getElementById('tab-' + t).classList.remove('active');
    });
    document.getElementById(tab + '-module').classList.remove('hidden');
    document.getElementById('tab-' + tab).classList.add('active');
}

/* ================= TIMER ================= */
function startTimer() {
    startTime = Date.now();
    document.getElementById('timerText').textContent = "⏱️ 00:00";
    timerInterval = setInterval(() => {
        const s = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timerText').textContent = `⏱️ ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
    }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }

/* ================= THUMBNAIL GENERATOR ================= */
async function generateThumbnail() {
    const rawPrompt = document.getElementById('promptBox').value.trim();
    if (!rawPrompt) return alert("कृपया प्रॉम्प्ट बॉक्स में प्रॉम्प्ट डालें!");

    const engine = document.getElementById('engineSelect').value;
    const btn = document.getElementById('thumbBtn');
    const statusRow = document.getElementById('genStatus');
    const statusText = document.getElementById('statusText');
    const result = document.getElementById('thumbResult');
    const img = document.getElementById('thumbImg');

    btn.disabled = true;
    result.classList.add('hidden');
    statusRow.classList.remove('hidden');
    startTimer();

    try {
        if (engine === "dall-e-3") {
            // 1. Ensure User is Signed in to Puter
            if (!puter.auth.isSignedIn()) {
                statusText.textContent = "Puter लॉगिन पॉपअप खुल रहा है...";
                await puter.auth.signIn();
                checkPuterStatus();
            }

            statusText.textContent = "ChatGPT DALL-E 3 (16:9 HD) से फ़ोटो बन रही है...";

            // Direct DALL-E 3 call with 16:9 YouTube size (1792x1024)
            const res = await puter.ai.txt2img(rawPrompt, {
                model: "dall-e-3",
                size: "1792x1024",
                quality: "standard"
            });

            let imgUrl = null;
            if (typeof res === "string") imgUrl = res;
            else if (res instanceof HTMLImageElement) imgUrl = res.src;
            else if (res.src) imgUrl = res.src;
            else if (res instanceof Blob) imgUrl = URL.createObjectURL(res);

            if (!imgUrl) throw new Error("इमेज डेटा प्राप्त नहीं हुआ।");
            currentImageUrl = imgUrl;

        } else {
            // Cloudflare Workers AI Fallback
            statusText.textContent = "Cloudflare AI से बना रहे हैं...";
            const response = await fetch(`${WORKER_URL}/cf/image`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: rawPrompt, model: "@cf/black-forest-labs/flux-1-schnell" })
            });
            const data = await response.json();
            if (!response.ok || !data.b64) throw new Error(data.error || "Cloudflare Error");
            currentImageUrl = `data:image/jpeg;base64,${data.b64}`;
        }

        img.src = currentImageUrl;
        result.classList.remove('hidden');

    } catch (err) {
        console.error(err);
        const msg = String(err.message || err);
        if (msg.includes("402") || msg.includes("balance") || msg.includes("credit") || msg.includes("funds")) {
            alert("⚠️ इस Puter अकाउंट का फ़्री बैलेंस खत्म हो गया है!\n\nऊपर लाल रंग के 'नया अकाउंट' बटन पर क्लिक करके किसी अन्य ईमेल से तुरंत नया लॉगिन करें।");
        } else {
            alert("⚠️ Error: " + msg);
        }
    } finally {
        stopTimer();
        statusRow.classList.add('hidden');
        btn.disabled = false;
    }
}

function downloadThumbnail() {
    if (!currentImageUrl) return;
    const a = document.createElement('a');
    a.href = currentImageUrl;
    a.download = `youtube-news-thumbnail-${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
}

/* ================= SCRIPT GENERATOR ================= */
async function generateScript() {
    const prompt = document.getElementById('promptInput').value.trim();
    const model = document.getElementById('modelSelect').value;
    const btn = document.getElementById('generateBtn');
    const loader = document.getElementById('scriptLoader');
    const output = document.getElementById('scriptOutput');

    btn.disabled = true; loader.style.display = "block"; output.value = "";
    try {
        const res = await fetch(`${WORKER_URL}/v1/chat/completions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: model,
                messages: [{ role: "user", content: prompt + "\n\nनोट: स्क्रिप्ट को बिना किसी स्टार (**), हैशटैग (#) या बुलेट पॉइंट के सीधा एंकर के पढ़ने के लिए साफ़ पैराग्राफ में लिखें।" }]
            })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error?.message || "Script API Error");
        output.value = data.choices[0].message.content.replace(/[\*#]/g, '').trim();
    } catch (e) {
        output.value = "⚠️ " + e.message;
    } finally {
        btn.disabled = false; loader.style.display = "none";
    }
}

function copyScript() {
    const s = document.getElementById('scriptOutput');
    if (!s.value) return;
    s.select();
    document.execCommand('copy');
    alert("✅ स्क्रिप्ट कॉपी हो गई!");
}
</script>
</body>
</html>
