<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI News Studio</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --accent: #00d26a;
            --border: #333333;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }
        h2 { font-size: 1.3rem; margin-bottom: 10px; text-align: center; color: var(--accent); }
        
        .server-status {
            text-align: center;
            font-size: 0.85rem;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            color: #aaa;
        }
        .server-status a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }
        
        label { font-size: 0.9rem; margin-bottom: 5px; display: block; color: #aaa; }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
        }
        
        textarea { resize: vertical; min-height: 120px; }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        button:active { opacity: 0.7; }
        button:disabled { background-color: #555; color: #888; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        .btn-secondary { background-color: #444; color: #fff; }
        .btn-copy { background-color: #007bff; color: #fff; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); flex: 1; }
        .tab-btn.active { background-color: var(--accent); color: #000; border-color: var(--accent); }
        
        .hidden { display: none; }
        .loader { text-align: center; font-size: 0.9rem; color: var(--accent); margin-top: -10px; margin-bottom: 15px; display: none; }
        audio { width: 100%; margin-top: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <h2>AI Studio Mobile</h2>

    <!-- Server Test Link -->
    <div class="server-status">
        🟢 Server Status: <a href="https://aryannewstech.babu902654.workers.dev/" target="_blank">Click Here to Test Server</a>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-script" onclick="switchTab('script')">📝 Script AI</button>
        <button class="tab-btn" id="tab-tts" onclick="switchTab('tts')">🎙️ Voice AI</button>
    </div>

    <!-- MODULE 1: Script Generator -->
    <div id="script-module" class="card">
        
        <label>AI Model (Select Free Model)</label>
        <select id="modelSelect">
            <option value="google/gemini-2.5-flash:free" selected>Gemini 2.5 Flash (Free)</option>
            <option value="qwen/qwen-2.5-72b-instruct:free">Qwen 72B (Best for Hindi)</option>
            <option value="qwen/qwen3.7-max:free">Qwen 3.7 Max (Free)</option>
        </select>

        <label>OR Enter Custom Model ID (Optional)</label>
        <input type="text" id="customModel" placeholder="e.g. google/gemini-2.5-flash:free">

        <label>Topic / Master Prompt</label>
        <textarea id="promptInput" placeholder="टॉपिक लिखें...">नमस्कार! आप देख रहे हैं आर्यन न्यूज़ टेक। आज की टॉप 10 खबरें तैयार करें। स्क्रिप्ट को न्यूज़ एंकर के पढ़ने के अंदाज़ में लिखें।</textarea>

        <button id="generateBtn" onclick="generateScript()">Generate Script</button>
        <div id="scriptLoader" class="loader">Generating... Please wait.</div>

        <label style="margin-top: 15px;">Output Script</label>
        <textarea id="scriptOutput" placeholder="Your generated script will appear here..."></textarea>
        
        <div class="btn-group">
            <button class="btn-copy" onclick="copyScript()">📋 Copy Script</button>
            <button class="btn-secondary" onclick="copyToTTS()">Voice AI ➡️</button>
        </div>
    </div>

    <!-- MODULE 2: Text-to-Speech -->
    <div id="tts-module" class="card hidden">
        <label>Voice Model</label>
        <select id="ttsModel">
            <option value="xkiro-voice">xKiro Voice AI</option>
        </select>

        <label>Custom Voice ID (Leave blank for default)</label>
        <!-- xKiro डैशबोर्ड से हिंदी वॉयस ID यहाँ टाइप कर सकते हैं -->
        <input type="text" id="customVoice" placeholder="e.g. hi-IN-1 या hindi-male">

        <label>Text to Speak</label>
        <textarea id="ttsInput" placeholder="यहाँ वह टेक्स्ट पेस्ट करें जिसे आवाज़ में बदलना है..."></textarea>

        <button id="ttsBtn" onclick="generateSpeech()">Generate Audio</button>
        <div id="ttsLoader" class="loader">Generating Audio... Please wait.</div>

        <div id="audioContainer" class="hidden">
            <label style="margin-top: 15px;">Your Audio</label>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://aryannewstech.babu902654.workers.dev";

        function switchTab(tab) {
            document.getElementById('script-module').classList.add('hidden');
            document.getElementById('tts-module').classList.add('hidden');
            document.getElementById('tab-script').classList.remove('active');
            document.getElementById('tab-tts').classList.remove('active');

            document.getElementById(`${tab}-module`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        // नई कॉपी स्क्रिप्ट फंक्शन
        function copyScript() {
            const script = document.getElementById('scriptOutput');
            if(script.value.trim() === "") return alert("कॉपी करने के लिए कोई स्क्रिप्ट नहीं है!");
            script.select();
            document.execCommand("copy");
            alert("✅ स्क्रिप्ट कॉपी हो गई!");
        }

        function copyToTTS() {
            const script = document.getElementById('scriptOutput').value;
            if(script.trim() === "") return alert("पहले स्क्रिप्ट जनरेट करें!");
            document.getElementById('ttsInput').value = script;
            switchTab('tts');
        }

        async function generateScript() {
            let customModelInput = document.getElementById('customModel').value.trim();
            let finalModel = customModelInput ? customModelInput : document.getElementById('modelSelect').value;

            // छिपी हुई कमांड ताकि AI क्लीन टेक्स्ट दे
            const basePrompt = document.getElementById('promptInput').value;
            const hiddenInstructions = "\n\nमहत्वपूर्ण निर्देश: पूरी स्क्रिप्ट बिल्कुल क्लीन प्लेन टेक्स्ट (Plain Text) में होनी चाहिए। किसी भी तरह के स्टार (**), बुलेट पॉइंट, डॉट या हैश (#) का इस्तेमाल बिल्कुल न करें। इसे सीधा एक न्यूज़ एंकर के पढ़ने के लिए साफ़ पैराग्राफ फॉर्मेट में दें।";
            const finalPrompt = basePrompt + hiddenInstructions;

            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('scriptLoader');
            const output = document.getElementById('scriptOutput');

            btn.disabled = true;
            loader.style.display = "block";
            output.value = "";

            try {
                const response = await fetch(`${WORKER_URL}/v1/chat/completions`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: finalModel,
                        messages: [{ role: "user", content: finalPrompt }]
                    })
                });

                const data = await response.json();
                
                if (!response.ok || data.error) {
                    throw new Error(data.error?.message || data.error || `API Error (${response.status})`);
                }
                
                // रिस्पांस से अगर फिर भी कुछ स्टार आ जाएँ तो उसे JavaScript से रिमूव कर रहे हैं
                let cleanScript = data.choices[0].message.content;
                cleanScript = cleanScript.replace(/\*/g, ''); 
                cleanScript = cleanScript.replace(/#/g, ''); 
                
                output.value = cleanScript.trim();
            } catch (error) {
                output.value = "⚠️ Error: " + error.message;
            } finally {
                btn.disabled = false;
                loader.style.display = "none";
            }
        }

        async function generateSpeech() {
            const text = document.getElementById('ttsInput').value;
            if (!text) return alert("कृपया जनरेट करने के लिए टेक्स्ट डालें!");

            const model = document.getElementById('ttsModel').value;
            let voice = document.getElementById('customVoice').value.trim();
            
            // अगर कस्टम वॉयस खाली है तो एक डिफ़ॉल्ट वैल्यू भेजेंगे
            if (!voice) voice = "alloy"; 

            const btn = document.getElementById('ttsBtn');
            const loader = document.getElementById('ttsLoader');
            const audioContainer = document.getElementById('audioContainer');
            const audioPlayer = document.getElementById('audioPlayer');

            btn.disabled = true;
            loader.style.display = "block";
            audioContainer.classList.add('hidden');

            try {
                const response = await fetch(`${WORKER_URL}/v1/audio/speech`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: model,
                        input: text,
                        voice: voice
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || errData.error || "Failed to generate audio");
                }

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                audioPlayer.src = audioUrl;
                audioContainer.classList.remove('hidden');
                audioPlayer.play();

            } catch (error) {
                alert("Error: " + error.message + "\n\nटिप: अगर वॉयस का एरर आ रहा है, तो xKiro डैशबोर्ड से 'Voice ID' चेक करें और उसे Custom Voice Box में डालें।");
            } finally {
                btn.disabled = false;
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
