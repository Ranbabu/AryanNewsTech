<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI News Studio Pro</title>
<style>
    :root { --bg-color:#121212; --card-bg:#1e1e1e; --text-main:#ffffff; --accent:#00d26a; --border:#333333; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color:var(--bg-color); color:var(--text-main); margin:0; padding:15px; }
    h2 { font-size:1.3rem; margin-bottom:10px; text-align:center; color:var(--accent); }
    .server-status { text-align:center; font-size:0.85rem; background-color:var(--card-bg); padding:10px; border-radius:8px; border:1px solid var(--border); margin-bottom:20px; color:#aaa; }
    .server-status a { color:var(--accent); text-decoration:none; font-weight:bold; }
    .card { background-color:var(--card-bg); padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid var(--border); }
    label { font-size:0.9rem; margin-bottom:5px; display:block; color:#aaa; }
    input, select, textarea { width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid var(--border); background-color:var(--bg-color); color:var(--text-main); font-size:1rem; box-sizing:border-box; }
    textarea { resize:vertical; min-height:100px; }
    button { width:100%; padding:14px; background-color:var(--accent); color:#000; border:none; border-radius:8px; font-size:1rem; font-weight:bold; cursor:pointer; transition:opacity 0.2s; }
    button:active { opacity:0.7; }
    button:disabled { background-color:#555; color:#888; }
    .btn-group { display:flex; gap:10px; margin-top:5px; }
    .btn-secondary { background-color:#444; color:#fff; }
    .btn-copy { background-color:#007bff; color:#fff; }
    .tabs { display:flex; gap:8px; margin-bottom:20px; }
    .tab-btn { background-color:var(--card-bg); color:var(--text-main); border:1px solid var(--border); flex:1; font-size:0.9rem; padding:12px 4px; }
    .tab-btn.active { background-color:var(--accent); color:#000; border-color:var(--accent); }
    .hidden { display:none; }
    .hint { font-size:0.75rem; color:#888; margin-top:-10px; margin-bottom:12px; }
    #thumbImg { width:100%; border-radius:8px; border:1px solid var(--border); margin-bottom:10px; display:block; }
    /* स्पिनर + टाइमर */
    .spin-row { display:flex; align-items:center; justify-content:center; gap:10px; margin:-5px 0 15px; }
    .spinner { width:22px; height:22px; border:3px solid #333; border-top-color:var(--accent); border-radius:50%; animation:spin 0.9s linear infinite; flex:none; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #statusText { color:#aaa; font-size:0.85rem; }
    #timerText { font-variant-numeric:tabular-nums; color:var(--accent); font-weight:bold; font-size:0.95rem; }
    .success-msg { text-align:center; color:var(--accent); font-size:0.9rem; margin:-5px 0 15px; font-weight:bold; }
</style>
</head>
<body>

<h2>AI News Studio Pro</h2>

<div class="server-status">
    🟢 Server Status: <a href="https://aryannewstech.babu902654.workers.dev/" target="_blank">Click Here to Test Server</a>
</div>

<div class="tabs">
    <button class="tab-btn active" id="tab-script" onclick="switchTab('script')">📝 Script</button>
    <button class="tab-btn" id="tab-thumb" onclick="switchTab('thumb')">🎨 Thumbnail</button>
</div>

<!-- ========== MODULE 1: SCRIPT ========== -->
<div id="script-module" class="card">
    <label>AI Model (Select Free Model)</label>
    <select id="modelSelect">
        <option value="google/gemini-2.5-flash:free" selected>Gemini 2.5 Flash (Free)</option>
        <option value="qwen/qwen-2.5-72b-instruct:free">Qwen 72B (Best for Hindi)</option>
        <option value="qwen/qwen3.7-max:free">Qwen 3.7 Max (Free)</option>
    </select>

    <label>OR Enter Custom Model ID (Optional)</label>
    <input type="text" id="customModel" placeholder="e.g. google/gemini-2.5-flash:free">

    <label>Topic / Master Prompt</label>
    <textarea id="promptInput" placeholder="टॉपिक लिखें...">नमस्कार! आप देख रहे हैं आर्यन न्यूज़ टेक। आज की टॉप 10 खबरें तैयार करें। स्क्रिप्ट को न्यूज़ एंकर के पढ़ने के अंदाज़ में लिखें।</textarea>

    <button id="generateBtn" onclick="generateScript()">Generate Script</button>
    <div id="scriptLoader" class="loader" style="display:none; text-align:center; color:var(--accent); font-size:0.9rem; margin:-10px 0 15px;">Generating... Please wait.</div>

    <label style="margin-top:15px;">Output Script</label>
    <textarea id="scriptOutput" placeholder="Your generated script will appear here..."></textarea>

    <div class="btn-group">
        <button class="btn-copy" onclick="copyScript()">📋 Copy</button>
    </div>
</div>

<!-- ========== MODULE 2: THUMBNAIL (सिर्फ़ prompt paste box + spinner + timer) ========== -->
<div id="thumb-module" class="card hidden">
    <label>🎨 Image Engine</label>
    <input type="text" value="sensenova/sensenova-u1.5-lite (xKiro FREE tier)" disabled>
    <p class="hint">💡 नीचे पूरा प्रॉम्प्ट-ब्लॉक पेस्ट करें (Keyword / Text / Concept / Prompt) — कोड अपने आप पहचान लेगा। Image बनने तक स्पिनर और टाइमर चलता रहेगा।</p>

    <label>Prompt Paste Box</label>
    <textarea id="promptBox" style="min-height:170px;" placeholder="Keyword: UPI Tap & Pay&#10;Text: UPI क्रांति! नए फीचर!&#10;Concept: Dynamic, futuristic, showing a hand tapping a phone on a POS machine, with digital payment graphics and a sense of speed.&#10;Prompt: A high-angle, cinematic, photorealistic image of a hand holding a modern smartphone, gently tapping it against a sleek, futuristic POS machine at a retail counter. Digital payment transaction graphics, glowing lines, and binary code subtly emanate from the phone and POS. The background is a slightly blurred, modern, bustling Indian market or store. Emphasize a sense of speed, ease, and advanced technology. The lighting is vibrant and dynamic, with a shallow depth of field. 16:9 aspect ratio."></textarea>

    <button id="thumbBtn" onclick="generateThumbnail()">🎨 Generate Thumbnail</button>

    <div id="genStatus" class="spin-row hidden">
        <div class="spinner"></div>
        <span id="statusText">Job बनाया जा रहा है...</span>
        <span id="timerText">⏱️ 00:00</span>
    </div>
    <div id="successMsg" class="success-msg hidden"></div>

    <div id="thumbResult" class="hidden">
        <img id="thumbImg" alt="YouTube Thumbnail">
        <div class="btn-group">
            <button class="btn-copy" onclick="downloadImage(false)">⬇️ Download PNG</button>
            <button class="btn-secondary" onclick="downloadImage(true)">📐 1280×720 Download</button>
        </div>
    </div>
</div>

<script>
const WORKER_URL = "https://aryannewstech.babu902654.workers.dev";
const IMG_MODEL  = "sensenova/sensenova-u1.5-lite";  // xKiro FREE image model
const IMG_SIZE   = "1792x1024";                      // xKiro supported 16:9 size
let currentImageUrl = null;

/* ================= TAB SWITCH ================= */
function switchTab(tab) {
    ['script','thumb'].forEach(t => {
        document.getElementById(t + '-module').classList.add('hidden');
        document.getElementById('tab-' + t).classList.remove('active');
    });
    document.getElementById(tab + '-module').classList.remove('hidden');
    document.getElementById('tab-' + tab).classList.add('active');
}

/* ================= SCRIPT MODULE ================= */
function copyScript() {
    const script = document.getElementById('scriptOutput');
    if (script.value.trim() === "") return alert("कॉपी करने के लिए कोई स्क्रिप्ट नहीं है!");
    script.select();
    document.execCommand("copy");
    alert("✅ स्क्रिप्ट कॉपी हो गई!");
}

async function generateScript() {
    let customModelInput = document.getElementById('customModel').value.trim();
    let finalModel = customModelInput ? customModelInput : document.getElementById('modelSelect').value;
    const basePrompt = document.getElementById('promptInput').value;
    const hiddenInstructions = "\n\nमहत्वपूर्ण निर्देश: पूरी स्क्रिप्ट बिल्कुल क्लीन प्लेन टेक्स्ट (Plain Text) में होनी चाहिए। किसी भी तरह के स्टार (**), बुलेट पॉइंट, डॉट या हैश (#) का इस्तेमाल बिल्कुल न करें। इसे सीधा एक न्यूज़ एंकर के पढ़ने के लिए साफ़ पैराग्राफ फॉर्मेट में दें।";
    const finalPrompt = basePrompt + hiddenInstructions;
    const btn = document.getElementById('generateBtn');
    const loader = document.getElementById('scriptLoader');
    const output = document.getElementById('scriptOutput');
    btn.disabled = true; loader.style.display = "block"; output.value = "";
    try {
        const response = await fetch(`${WORKER_URL}/v1/chat/completions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: finalModel, messages: [{ role: "user", content: finalPrompt }] })
        });
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error?.message || data.error || `API Error (${response.status})`);
        let cleanScript = data.choices[0].message.content;
        cleanScript = cleanScript.replace(/\*/g, '').replace(/#/g, '');
        output.value = cleanScript.trim();
    } catch (error) {
        output.value = "⚠️ Error: " + error.message;
    } finally {
        btn.disabled = false; loader.style.display = "none";
    }
}

/* ================= PROMPT PARSER (Demo फॉर्मेट पहचान) ================= */
function parsePromptBlock(raw) {
    const mK = raw.match(/Keyword:\s*(.+)/i);
    const mT = raw.match(/Text:\s*(.+)/i);
    const mC = raw.match(/Concept:\s*(.+)/i);
    const mP = raw.match(/Prompt:\s*([\s\S]+)/i);
    let prompt = mP ? mP[1].trim() : raw.trim();
    prompt = prompt.replace(/\s+/g, " ");
    let final = "";
    if (mC) final += mC[1].trim().replace(/\s+/g, " ") + ". ";
    final += prompt;
    if (mT) final += `. Large bold headline text written exactly and correctly: "${mT[1].trim()}", text clearly readable, high contrast outline on text`;
    if (mK) final += `. Main theme keyword: ${mK[1].trim()}`;
    final += ". YouTube thumbnail, wide 16:9 composition, highly detailed, vibrant colors, dramatic professional lighting, sharp focus, no watermark, no logo.";
    return final;
}

/* ================= SPINNER + TIMER ================= */
let timerInterval = null, startTime = 0;
function fmtClock(ms) {
    const s = Math.floor(ms / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    return `⏱️ ${mm}:${ss}`;
}
function fmtHuman(ms) {
    const s = Math.round(ms / 1000);
    if (s < 60) return `${s} सेकंड`;
    return `${Math.floor(s / 60)} मिनट ${s % 60} सेकंड`;
}
function startTimer() {
    startTime = Date.now();
    document.getElementById('timerText').textContent = fmtClock(0);
    timerInterval = setInterval(() => {
        document.getElementById('timerText').textContent = fmtClock(Date.now() - startTime);
    }, 1000);
}
function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
}
function setStatus(msg) {
    document.getElementById('statusText').textContent = msg;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= IMAGE JOB (स्मार्ट retry के साथ) ================= */
async function createImageJob(prompt) {
    let lastErr = null;
    for (let attempt = 0; attempt < 2; attempt++) {
        try {
            const r1 = await fetch(`${WORKER_URL}/v1/images/generations`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ model: IMG_MODEL, prompt: prompt, n: 1, size: IMG_SIZE })
            });
            const job = await r1.json();
            if (!r1.ok || !job.id) {
                const msg = job.error?.message || job.error || `Job create नहीं हुआ (HTTP ${r1.status})`;
                // 4xx = पक्की गलती (retry बेकार), 5xx/नेटवर्क = retry करो
                if (r1.status >= 400 && r1.status < 500) throw new Error(msg);
                throw Object.assign(new Error(msg), { retryable: true });
            }
            return job;
        } catch (e) {
            lastErr = e;
            if (!e.retryable || attempt === 1) throw e;
            setStatus("⚠️ नेटवर्क गड़बड़ी — दोबारा कोशिश हो रही है...");
            await sleep(2500);
        }
    }
    throw lastErr;
}

async function pollImageJob(id) {
    const deadline = Date.now() + 8 * 60 * 1000;   // स्लो मॉडल के लिए 8 मिनट तक धैर्य
    let waitMs = 2000;                             // तेज़ शुरुआत
    while (Date.now() < deadline) {
        await sleep(waitMs);
        waitMs = Math.min(waitMs * 1.4, 8000);
        setStatus("🎨 Image render हो रही है... कतार में लगी है");
        let st = null;
        for (let attempt = 0; attempt < 3 && !st; attempt++) {   // polling नेटवर्क retry
            try {
                const r2 = await fetch(`${WORKER_URL}/v1/images/generations/${id}`);
                st = await r2.json();
            } catch (e) { await sleep(2000); }
        }
        if (!st) continue;
        if (st.status === "succeeded") return st.data && st.data[0] && st.data[0].url;
        if (st.status === "failed" || st.status === "blocked") {
            throw new Error(st.error?.message || ("Job " + st.status));
        }
        setStatus("🎨 Image render हो रही है... (" + st.status + ")");
    }
    throw new Error("Image job 8 मिनट में पूरा नहीं हुआ — दोबारा कोशिश करें");
}

/* ================= GENERATE THUMBNAIL ================= */
async function generateThumbnail() {
    const raw = document.getElementById('promptBox').value.trim();
    if (!raw) return alert("कृपया Prompt Paste Box में प्रॉन्प्ट पेस्ट करें!");
    const prompt = parsePromptBlock(raw);

    const btn = document.getElementById('thumbBtn');
    const status = document.getElementById('genStatus');
    const success = document.getElementById('successMsg');
    const result = document.getElementById('thumbResult');
    const img = document.getElementById('thumbImg');

    btn.disabled = true;
    result.classList.add('hidden');
    success.classList.add('hidden');
    status.classList.remove('hidden');
    setStatus("Job बनाया जा रहा है...");
    startTimer();

    try {
        const job = await createImageJob(prompt);
        setStatus("✅ Job बन गया — image render हो रही है...");
        const url = await pollImageJob(job.id);
        if (!url) throw new Error("Image URL नहीं मिला");
        const elapsed = Date.now() - startTime;
        stopTimer();
        document.getElementById('timerText').textContent = fmtClock(elapsed);
        status.classList.add('hidden');
        success.textContent = `✅ Image बन गई! कुल समय: ${fmtHuman(elapsed)}`;
        success.classList.remove('hidden');
        currentImageUrl = url;
        img.src = url;
        result.classList.remove('hidden');
    } catch (error) {
        stopTimer();
        status.classList.add('hidden');
        alert("⚠️ Thumbnail Error: " + error.message + "\n(लगा समय: " + fmtHuman(Date.now() - startTime) + ")");
    } finally {
        btn.disabled = false;
    }
}

/* ================= DOWNLOAD (1280x720 cover-crop) ================= */
function downloadImage(forceResize) {
    if (!currentImageUrl) return alert("पहले थंबनेल जनरेट करें!");
    const finish = (url, name) => {
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
    };
    if (!forceResize && currentImageUrl.startsWith("data:")) {
        finish(currentImageUrl, "thumbnail-" + Date.now() + ".png");
        return;
    }
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => {
        try {
            const c = document.createElement('canvas');
            c.width = 1280; c.height = 720;
            const ctx = c.getContext('2d');
            const scale = Math.max(1280 / im.width, 720 / im.height);
            const dw = im.width * scale, dh = im.height * scale;
            ctx.drawImage(im, (1280 - dw) / 2, (720 - dh) / 2, dw, dh);
            c.toBlob(blob => {
                const u = URL.createObjectURL(blob);
                finish(u, "youtube-thumbnail-1280x720.png");
                setTimeout(() => URL.revokeObjectURL(u), 5000);
            }, "image/png");
        } catch (e) { window.open(currentImageUrl, "_blank"); }
    };
    im.onerror = () => window.open(currentImageUrl, "_blank");
    im.src = currentImageUrl;
}
</script>
</body>
</html>
